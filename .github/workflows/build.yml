name: Build Carbon IPA

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-15
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Set up iOS archive
        uses: ./.github/actions/setup-ios
        with:
          sdk: iphoneos
          cache-scope: archive
          
      - name: Build and archive IPA
        run: |
          set -euo pipefail
          cd Carbon
          
          # Create the Xcode archive
          xcodebuild archive \
            -project Carbon.xcodeproj \
            -scheme Carbon \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ./build/DerivedData \
            -archivePath ./build/Carbon.xcarchive \
            -showBuildTimingSummary \
            COMPILATION_CACHE_ENABLE_CACHING=YES \
            COMPILATION_CACHE_ENABLE_DIAGNOSTIC_REMARKS=YES \
            COMPILATION_CACHE_CAS_PATH="$COMPILATION_CACHE_DIR" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM=""
            
          # Package the unsigned app
          mkdir -p ./build/ipa/Payload
          ditto ./build/Carbon.xcarchive/Products/Applications/Carbon.app ./build/ipa/Payload/Carbon.app

          # Guard: fail if bundle resources were not copied into the app
          APP=./build/ipa/Payload/Carbon.app
          # Keep both home-screen PNGs available for sideloading even when actool
          # emits only the 2x fallback alongside the compiled asset catalog.
          cp Resources/Assets.xcassets/AppIcon.appiconset/AppIcon-120.png "$APP/AppIcon60x60@2x.png"
          cp Resources/Assets.xcassets/AppIcon.appiconset/AppIcon-180.png "$APP/AppIcon60x60@3x.png"
          test -f "$APP/Assets.car" || { echo "::error::Assets.car missing from app bundle"; exit 1; }
          HALIDE=$(find "$APP/LUTs/halide" -name '*.ccube' 2>/dev/null | wc -l | tr -d ' ')
          NOFUSION=$(find "$APP/LUTs/nofusion" -name '*.lutbin' 2>/dev/null | wc -l | tr -d ' ')
          echo "Bundled LUTs: halide=$HALIDE nofusion=$NOFUSION"
          [ "$HALIDE" -eq 24 ] && [ "$NOFUSION" -eq 20 ] || { echo "::error::LUTs missing from app bundle"; exit 1; }
          du -sh "$APP"
          # A conventional ZIP with Payload at its root, with no AppleDouble data.
          (cd build/ipa && COPYFILE_DISABLE=1 /usr/bin/zip -qry -X ../Carbon-unsigned.ipa Payload)

      - name: Validate packaged IPA
        run: |
          swift ci/check_bundle.swift Carbon/build/ipa/Payload/Carbon.app
          python3 ci/check_ipa.py Carbon/build/Carbon-unsigned.ipa
            
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Carbon-unsigned.ipa
          path: Carbon/build/*.ipa
          if-no-files-found: error
          retention-days: 14

  unit-tests:
    name: Run iOS unit tests
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up iOS unit tests
        uses: ./.github/actions/setup-ios
        with:
          sdk: iphonesimulator
          cache-scope: unit-tests

      - name: Build and run iOS unit tests
        run: bash ci/run_simulator_tests.sh CarbonKitTests TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Carbon-test-results
          path: Carbon/build/TestResults.xcresult
          if-no-files-found: warn
          retention-days: 14

      - name: Upload test phase logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Carbon-unit-test-logs
          path: Carbon/build/TestResults-*.log
          if-no-files-found: warn
          retention-days: 14

  verify-pipeline:
    name: Verify render pipeline and assets
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run pipeline verification
        run: |
          python -m unittest discover -s ci -p 'test_*.py'
          python verify_pipeline.py
          
      - name: Check asset integrity
        run: |
          python ci/check_assets.py

  screenshots:
    name: Capture UI Screenshots
    runs-on: macos-15
    permissions:
      contents: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Set up iOS UI tests
        uses: ./.github/actions/setup-ios
        with:
          sdk: iphonesimulator
          cache-scope: ui-tests
          
      - name: Capture gallery screenshots
        id: capture
        run: bash ci/run_simulator_tests.sh CarbonUITests/CarbonUITests/testCaptureAllScreens UITestResults --keep-simulator
      
      - name: Export PNG screenshots and browser gallery
        if: always()
        run: |
          python3 ci/export_screenshots.py Carbon/build/UITestResults.xcresult Carbon/build/UIScreenshots

      - name: Upload screenshots
        id: screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Carbon-UI-Screenshots
          path: Carbon/build/UIScreenshots/
          if-no-files-found: error
          retention-days: 30

      - name: Add screenshots to summary
        if: steps.screenshots.outcome == 'success'
        env:
          SCREENSHOTS_URL: ${{ steps.screenshots.outputs.artifact-url }}
        run: |
          python3 ci/export_screenshots.py Carbon/build/UIScreenshots \
            --publish-ref refs/screenshots/latest \
            --run-dir "runs/${{ github.run_id }}-${{ github.run_attempt }}" \
            --artifact-url "$SCREENSHOTS_URL" \
            --summary-file "$GITHUB_STEP_SUMMARY"

      # Publish the nine gallery PNGs before running the remaining interaction,
      # accessibility, and transition checks. Reuse the same booted device and
      # compiled bundles so this split does not repeat build or simulator setup.
      - name: Verify welcome interactions and accessibility
        if: ${{ !cancelled() && steps.capture.outcome == 'success' }}
        run: bash ci/run_simulator_tests.sh CarbonUITests/WelcomeUITests WelcomeTestResults --reuse-simulator

      - name: Upload UI test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Carbon-UI-Test-Results
          path: |
            Carbon/build/UITestResults.xcresult
            Carbon/build/WelcomeTestResults.xcresult
          if-no-files-found: warn
          retention-days: 14

      - name: Upload UI test phase logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Carbon-UI-test-logs
          path: |
            Carbon/build/UITestResults-*.log
            Carbon/build/WelcomeTestResults-*.log
          if-no-files-found: warn
          retention-days: 14
