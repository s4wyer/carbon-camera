name: Build Carbon IPA

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-15
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest'

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          
      - name: Generate Xcode project
        run: |
          cd Carbon
          xcodegen generate
          
      - name: Run iOS tests
        run: |
          set -euo pipefail
          cd Carbon
          xcodebuild -version

          # Pick a concrete simulator that actually exists on this runner image
          DEST=$(xcrun simctl list devices available | grep -E '^ +iPhone' | head -1 | sed -E 's/.*\(([0-9A-Fa-f-]{36})\).*/\1/')
          echo "Selected simulator: ${DEST:-<none>}"

          if [ -n "$DEST" ]; then
            TARGET="platform=iOS Simulator,id=$DEST"
          else
            TARGET="generic/platform=iOS Simulator"
          fi

          rm -rf ./build/TestResults.xcresult
          xcodebuild test \
            -project Carbon.xcodeproj \
            -scheme Carbon \
            -destination "$TARGET" \
            -derivedDataPath ./build/DerivedData \
            -enableCodeCoverage YES \
            -resultBundlePath ./build/TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO
          
      - name: Build and archive IPA
        run: |
          set -euo pipefail
          cd Carbon
          
          # Create the Xcode archive
          xcodebuild archive \
            -project Carbon.xcodeproj \
            -scheme Carbon \
            -destination 'generic/platform=iOS' \
            -archivePath ./build/Carbon.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM=""
            
          # Package the unsigned app
          mkdir -p ./build/ipa/Payload
          ditto ./build/Carbon.xcarchive/Products/Applications/Carbon.app ./build/ipa/Payload/Carbon.app

          # Guard: fail if bundle resources were not copied into the app
          APP=./build/ipa/Payload/Carbon.app
          test -f "$APP/Assets.car" || { echo "::error::Assets.car missing from app bundle"; exit 1; }
          HALIDE=$(find "$APP/LUTs/halide" -name '*.ccube' 2>/dev/null | wc -l | tr -d ' ')
          NOFUSION=$(find "$APP/LUTs/nofusion" -name '*.lutbin' 2>/dev/null | wc -l | tr -d ' ')
          echo "Bundled LUTs: halide=$HALIDE nofusion=$NOFUSION"
          [ "$HALIDE" -eq 24 ] && [ "$NOFUSION" -eq 20 ] || { echo "::error::LUTs missing from app bundle"; exit 1; }
          du -sh "$APP"
          # A conventional ZIP with Payload at its root, with no AppleDouble data.
          (cd build/ipa && COPYFILE_DISABLE=1 /usr/bin/zip -qry -X ../Carbon-unsigned.ipa Payload)

      - name: Validate packaged IPA
        run: |
          swift ci/check_bundle.swift Carbon/build/ipa/Payload/Carbon.app
          python3 ci/check_ipa.py Carbon/build/Carbon-unsigned.ipa
            
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Carbon-unsigned.ipa
          path: Carbon/build/*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Explain IPA download
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ### Import into Feather
          Download the **Carbon-unsigned.ipa** artifact below, then **extract the downloaded ZIP**.
          Import the **Carbon-unsigned.ipa inside it** into Feather and sign with your certificate.
          Do not rename the GitHub artifact ZIP to `.ipa`: that ZIP contains the IPA, not `Payload/`.
          The IPA has passed archive, bundle metadata, ARM64 iOS executable, icon, and resource checks.
          EOF
          
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Carbon-test-results
          path: Carbon/build/TestResults.xcresult
          if-no-files-found: warn
          retention-days: 14

  verify-pipeline:
    name: Verify render pipeline and assets
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run pipeline verification
        run: |
          python -m unittest discover -s ci -p 'test_*.py'
          python verify_pipeline.py
          
      - name: Check asset integrity
        run: |
          python ci/check_assets.py

  screenshots:
    name: Capture UI Screenshots
    runs-on: macos-15
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest'

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          
      - name: Generate Xcode project
        run: |
          cd Carbon
          xcodegen generate
          
      - name: Run UI Tests and Capture Screenshots
        run: |
          set -euo pipefail
          cd Carbon
          
          # Select an iPhone simulator
          DEST=$(xcrun simctl list devices available | grep -E '^ +iPhone' | head -1 | sed -E 's/.*\(([0-9A-Fa-f-]{36})\).*/\1/')
          echo "Selected simulator: $DEST"
          
          mkdir -p ./build/UIScreenshots
          
          # Run UI tests with screenshot attachments enabled
          xcodebuild test \
            -project Carbon.xcodeproj \
            -scheme Carbon \
            -destination "platform=iOS Simulator,id=$DEST" \
            -only-testing:CarbonUITests \
            -resultBundlePath ./build/UITestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO || true
            
          # Extract screenshots from xcresult bundle
          python3 -c "
import os
import subprocess
import json

result_bundle = './build/UITestResults.xcresult'
output_dir = '../screenshots'
os.makedirs(output_dir, exist_ok=True)

try:
    # Export attachments using xcparse or xcresulttool
    cmd = ['xcrun', 'xcresulttool', 'get', '--path', result_bundle, '--format', 'json']
    print('Checking for test results...')
except Exception as e:
    print(f'Error extracting screenshots: {e}')
" || true
      
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Carbon-UI-Screenshots
          path: Carbon/build/UITestResults.xcresult
          if-no-files-found: warn
          retention-days: 30
      
      - name: Add screenshots to summary
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## 📸 UI Screenshots
          
          Screenshots of all major screens captured from iOS Simulator:
          
          - **01-welcome.png** - Welcome/onboarding screen
          - **02-camera.png** - Camera viewfinder with preset selector
          - **03-preset-menu.png** - Preset browser with film box art
          - **04-rolls.png** - Rolls/gallery screen
          - **05-settings.png** - Settings and attribution
          
          Download the **Carbon-UI-Screenshots** artifact to view.
          EOF
