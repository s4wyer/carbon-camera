name: Build Carbon IPA

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-15
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Set up iOS archive
        uses: ./.github/actions/setup-ios
        with:
          sdk: iphoneos
          cache-scope: archive
          
      - name: Build and archive IPA
        run: |
          set -euo pipefail
          cd Carbon
          
          # Create the Xcode archive
          xcodebuild archive \
            -project Carbon.xcodeproj \
            -scheme Carbon \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ./build/DerivedData \
            -archivePath ./build/Carbon.xcarchive \
            -showBuildTimingSummary \
            COMPILATION_CACHE_ENABLE_CACHING=YES \
            COMPILATION_CACHE_ENABLE_DIAGNOSTIC_REMARKS=YES \
            COMPILATION_CACHE_CAS_PATH="$COMPILATION_CACHE_DIR" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM=""
            
          # Package the unsigned app
          mkdir -p ./build/ipa/Payload
          ditto ./build/Carbon.xcarchive/Products/Applications/Carbon.app ./build/ipa/Payload/Carbon.app

          # Guard: fail if bundle resources were not copied into the app
          APP=./build/ipa/Payload/Carbon.app
          # Keep both home-screen PNGs available for sideloading even when actool
          # emits only the 2x fallback alongside the compiled asset catalog.
          cp Resources/Assets.xcassets/AppIcon.appiconset/AppIcon-120.png "$APP/AppIcon60x60@2x.png"
          cp Resources/Assets.xcassets/AppIcon.appiconset/AppIcon-180.png "$APP/AppIcon60x60@3x.png"
          test -f "$APP/Assets.car" || { echo "::error::Assets.car missing from app bundle"; exit 1; }
          HALIDE=$(find "$APP/LUTs/halide" -name '*.ccube' 2>/dev/null | wc -l | tr -d ' ')
          NOFUSION=$(find "$APP/LUTs/nofusion" -name '*.lutbin' 2>/dev/null | wc -l | tr -d ' ')
          LAPSE=$(find "$APP/LUTs/lapse" -name '*.cube' 2>/dev/null | wc -l | tr -d ' ')
          echo "Bundled LUTs: halide=$HALIDE nofusion=$NOFUSION lapse=$LAPSE"
          [ "$HALIDE" -eq 25 ] && [ "$NOFUSION" -eq 20 ] && [ "$LAPSE" -eq 1 ] || { echo "::error::LUTs missing from app bundle"; exit 1; }
          du -sh "$APP"
          # A conventional ZIP with Payload at its root, with no AppleDouble data.
          (cd build/ipa && COPYFILE_DISABLE=1 /usr/bin/zip -qry -X ../Carbon-unsigned.ipa Payload)

      - name: Validate packaged IPA
        run: |
          swift ci/check_bundle.swift Carbon/build/ipa/Payload/Carbon.app
          python3 ci/check_ipa.py Carbon/build/Carbon-unsigned.ipa
            
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Carbon-unsigned.ipa
          path: Carbon/build/*.ipa
          if-no-files-found: error
          retention-days: 14

  unit-tests:
    name: Run iOS unit tests
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up iOS unit tests
        uses: ./.github/actions/setup-ios
        with:
          sdk: iphonesimulator
          cache-scope: unit-tests

      - name: Build and run iOS unit tests
        run: bash ci/run_simulator_tests.sh CarbonKitTests TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Carbon-test-results
          path: Carbon/build/TestResults.xcresult
          if-no-files-found: warn
          retention-days: 14

      - name: Upload test phase logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Carbon-unit-test-logs
          path: Carbon/build/TestResults-*.log
          if-no-files-found: warn
          retention-days: 14

  raw-tests:
    name: Run native RAW decoder tests
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'

      - name: Verify RAW development with the macOS decoder
        run: bash ci/run_raw_tests.sh

  verify-pipeline:
    name: Verify render pipeline and assets
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run pipeline verification
        run: |
          python -m unittest discover -s ci -p 'test_*.py'
          python verify_pipeline.py
          
      - name: Check asset integrity
        run: |
          python ci/check_assets.py

  screenshots:
    name: Capture UI Screenshots
    runs-on: macos-15
    permissions:
      contents: read
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Set up iOS UI tests
        id: ios-setup
        uses: ./.github/actions/setup-ios
        with:
          sdk: iphonesimulator
          cache-scope: ui-tests
          
      - name: Capture gallery screenshots
        id: capture
        run: |
          set -euo pipefail
          mkdir -p Carbon/build
          python3 ci/capture_gallery.py 2>&1 | tee Carbon/build/Gallery-capture.log

      - name: Upload screenshots
        id: screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Carbon-UI-Screenshots
          path: Carbon/build/UIScreenshots/
          if-no-files-found: error
          retention-days: 30

      - name: Upload gallery capture logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Carbon-gallery-capture-logs
          path: Carbon/build/Gallery-*.log
          if-no-files-found: warn
          retention-days: 14

      # Gallery generation uses a Debug fixture harness and simctl, so PNGs do
      # not wait for XCTest startup. All six real UI tests still run afterward.
      - name: Verify full UI interactions and accessibility
        if: ${{ !cancelled() && steps.ios-setup.outcome == 'success' }}
        env:
          CARBON_SIMULATOR_ID: ${{ steps.capture.outputs.device }}
        run: bash ci/run_simulator_tests.sh CarbonUITests UITestResults

      - name: Upload UI test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Carbon-UI-Test-Results
          path: Carbon/build/UITestResults.xcresult
          if-no-files-found: warn
          retention-days: 14

      - name: Upload UI test phase logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Carbon-UI-test-logs
          path: Carbon/build/UITestResults-*.log
          if-no-files-found: warn
          retention-days: 14

  publish-gallery:
    name: Screenshot gallery
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
    # Run concurrently: needs: screenshots would wait for the UI suite too.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wait for gallery artifact
        id: gallery
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 ci/publish_gallery.py wait

      - name: Download gallery
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.gallery.outputs.artifact-id }}
          path: Carbon/build/UIScreenshots
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}

      - name: Publish inline gallery
        env:
          SCREENSHOTS_URL: ${{ steps.gallery.outputs.artifact-url }}
        run: python3 ci/publish_gallery.py publish Carbon/build/UIScreenshots
