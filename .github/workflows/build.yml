name: Verify welcome redesign
on:
  workflow_dispatch:
jobs:
  welcome:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: com.apple.CoreSimulator.SimDeviceType.iPhone-SE-3rd-generation
            label: se
          - device: com.apple.CoreSimulator.SimDeviceType.iPhone-16-Pro-Max
            label: pro-max
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest
      - run: brew install xcodegen
      - run: bash ci/verify_welcome.sh "${{ matrix.device }}" "${{ matrix.label }}"
      - if: always()
        run: |
          if [ -d "Carbon/build/Welcome-${{ matrix.label }}.xcresult" ]; then
            xcrun xcresulttool export attachments --path "Carbon/build/Welcome-${{ matrix.label }}.xcresult" --output-path "Carbon/build/Welcome-${{ matrix.label }}-screenshots" || true
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: welcome-${{ matrix.label }}
          path: |
            Carbon/build/Welcome-${{ matrix.label }}-screenshots
            Carbon/build/welcome-${{ matrix.label }}.log
            Carbon/build/Welcome-${{ matrix.label }}.xcresult
          retention-days: 7
