name: Build Carbon IPA

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-15
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest'

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          
      - name: Generate Xcode project
        run: |
          cd Carbon
          xcodegen generate
          
      - name: Run iOS tests
        run: |
          set -euo pipefail
          cd Carbon
          xcodebuild -version

          # Pick a concrete simulator that actually exists on this runner image
          DEST=$(xcrun simctl list devices available --json \
            | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; \
names=[x for v in d.values() for x in v if x.get("isAvailable")]; \
iphones=[x for x in names if "iPhone" in x["name"]]; \
print(iphones[0]["udid"] if iphones else "")')
          echo "Selected simulator: ${DEST:-<none>}"

          if [ -n "$DEST" ]; then
            TARGET="platform=iOS Simulator,id=$DEST"
          else
            TARGET="generic/platform=iOS Simulator"
          fi

          rm -rf ./build/TestResults.xcresult
          xcodebuild test \
            -project Carbon.xcodeproj \
            -scheme Carbon \
            -destination "$TARGET" \
            -derivedDataPath ./build/DerivedData \
            -enableCodeCoverage YES \
            -resultBundlePath ./build/TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO
          
      - name: Build and archive IPA
        run: |
          cd Carbon
          
          # Create the Xcode archive
          xcodebuild archive \
            -project Carbon.xcodeproj \
            -scheme Carbon \
            -destination 'generic/platform=iOS' \
            -archivePath ./build/Carbon.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM=""
            
          # Package the unsigned app
          mkdir -p ./build/Payload
          cp -R ./build/Carbon.xcarchive/Products/Applications/Carbon.app ./build/Payload/
          (cd build && /usr/bin/ditto -c -k --keepParent Payload Carbon-unsigned.ipa)
            
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Carbon-unsigned.ipa
          path: Carbon/build/*.ipa
          if-no-files-found: error
          retention-days: 14
          
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Carbon-test-results
          path: Carbon/build/TestResults.xcresult
          if-no-files-found: warn
          retention-days: 14

  verify-pipeline:
    name: Verify render pipeline and assets
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run pipeline verification
        run: |
          python verify_pipeline.py
          
      - name: Check asset integrity
        run: |
          python ci/check_assets.py
# Trigger CI check
