# XcodeGen project spec — the reproducible source of truth for the app target.
# Regenerate with: xcodegen generate  (or CI does it automatically)
# Rationale: a checked-in .xcodeproj is unreviewable, merge-hostile, and cannot be
# authored in a non-Apple environment. This file is the durable project definition.
name: Carbon
options:
  bundleIdPrefix: app.carbon
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete
    # App Store validation requirements
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Carbon:
    type: application
    platform: iOS
    sources:
      - path: Sources/CarbonApp
      - path: Sources/CarbonKit
    resources:
      - path: Resources/Assets.xcassets
    info:
      path: Sources/CarbonApp/Info.plist
      properties:
        CFBundleDisplayName: Carbon
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: Remjet
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiredDeviceCapabilities:
          - arm64
        NSCameraUsageDescription: >-
          Carbon needs the camera so you can take photographs. Nothing is uploaded
          and no account is required.
        NSPhotoLibraryAddUsageDescription: >-
          Carbon adds the photos you export to your library. It never reads your
          existing library.
        NSMicrophoneUsageDescription: >-
          Only when you record ambient sound with a photo (Voice Backings).
        NSLocalNetworkUsageDescription: >-
          Only when you pair a nearby phone or watch as a remote.
        NSBonjourServices:
          - _carbon-remote._tcp
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.carbon.Carbon
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
        SWIFT_EMIT_LOC_STRINGS: YES

  CarbonKitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/CarbonKitTests
    dependencies:
      - target: Carbon
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.carbon.CarbonTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Carbon:
    build:
      targets:
        Carbon: all
        CarbonKitTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - CarbonKitTests
    archive:
      config: Release